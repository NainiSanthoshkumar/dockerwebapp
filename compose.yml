version: "3.9"

services:
  devopsdb:
    image: nainisanthosh/myfirstpipeline:dbapp
    ports:
      - "3306:3306"
    deploy:
      replicas: 1
    networks:
      - mynetwork

  application:
    image: nainisanthosh/myfirstpipeline:javaapp
    ports:
      - "1234:8080"
    deploy:
      replicas: 3
    depends_on:
      - devopsdb
    networks:
      - mynetwork

networks:
  mynetwork:
    driver: overlay
